# Local development database. Production uses the shared Postgres on the server.
services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_dev_password
    ports:
      - "5433:5432"
    volumes:
      - portfolio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portfolio_pgdata:
