name: CI

on:
  pull_request:
  push:
    branches-ignore: [ "main" ]  # main runs CI via the deploy workflow
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts needs a value to load; nothing connects to it in CI
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t portfolio:ci .

      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint sh portfolio:ci -c \
            'node -v && test -f server.js && test -f scripts/admin-create.mjs && test -x /opt/migrate/node_modules/.bin/prisma'
